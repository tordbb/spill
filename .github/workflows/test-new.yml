name: Verify city builds

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check visual JavaScript
        run: |
          node --check site-overlays/city-visual-v19.js
          node --check site-overlays/city-visual-v20.js
          node --check site-overlays/city-visual-v21.js
          node --check site-overlays/city-visual-v23.js
          node --check site-overlays/city-visual-v24.js
          node --check site-overlays/city-visual-v25.js
      - name: Build and verify stable root plus visual parallel copy
        run: |
          set -euxo pipefail
          mkdir -p dist
          cat site-v3/part-*.txt | base64 -d | gzip -dc > dist/index.html
          patch --batch --forward -d dist -p1 < site-patches/sdk-city-v2.patch
          patch --batch --forward -d dist -p1 < site-patches/city-school-v3.patch
          patch --batch --forward -d dist -p1 < site-patches/city-farm-thought-v4.patch
          patch --batch --forward -d dist -p1 < site-patches/sudoku-levels-v5.patch
          patch --batch --forward -d dist -p1 < site-patches/sudoku-hint-ui-v5.patch
          patch --batch --forward -d dist -p1 < site-patches/sudoku-hint-js-v5.patch
          cat site-patches/city-balance-v6.part* > /tmp/city-balance-v6.patch
          patch --batch --forward -d dist -p1 < /tmp/city-balance-v6.patch
          base64 -d site-patches/city-balance-v7.patch.gz.b64 | gzip -dc > /tmp/city-balance-v7.patch
          patch --batch --forward -d dist -p1 < /tmp/city-balance-v7.patch
          base64 -d site-patches/city-balance-v8.patch.gz.b64 | gzip -dc > /tmp/city-balance-v8.patch
          patch --batch --forward -d dist -p1 < /tmp/city-balance-v8.patch
          cat site-patches/city-camera-v9.part* | base64 -d | gzip -dc > /tmp/city-camera-v9.patch
          patch --batch --forward -d dist -p1 < /tmp/city-camera-v9.patch
          cat site-patches/city-buses-v10.part* | base64 -d | gzip -dc > /tmp/city-buses-v10.patch
          patch --batch --forward -d dist -p1 < /tmp/city-buses-v10.patch
          patch --batch --forward -d dist -p1 < site-patches/city-bus-speed-v11.patch
          patch --batch --forward -d dist -p1 < site-patches/city-bus-riders-v12.patch
          patch --batch --forward -d dist -p1 < site-patches/city-bus-demand-v13.patch
          patch --batch --forward -d dist -p1 < site-patches/city-no-teachers-v14.patch
          base64 -d site-patches/city-lines-v15.patch.gz.b64 | gzip -dc > /tmp/city-lines-v15.patch
          patch --batch --forward -d dist -p1 < /tmp/city-lines-v15.patch
          base64 -d site-patches/city-bus-markers-fast-v16.patch.gz.b64 | gzip -dc > /tmp/city-bus-markers-fast-v16.patch
          patch --batch --forward -d dist -p1 < /tmp/city-bus-markers-fast-v16.patch
          patch --batch --forward -d dist -p1 < site-patches/city-farm-parallel-endpoints-v17.patch

          cp dist/index.html /tmp/city-v17.html
          python site-overlays/inject-v18.py dist/index.html root
          mkdir -p dist/new
          cp /tmp/city-v17.html dist/new/index.html
          python site-overlays/inject-v18.py dist/new/index.html parallel
          python site-overlays/inject-v19.py dist/new/index.html
          python site-overlays/inject-v20.py dist/new/index.html
          python site-overlays/inject-v21.py dist/new/index.html
          python site-overlays/inject-v23.py dist/new/index.html
          python site-overlays/inject-v24.py dist/new/index.html
          python site-overlays/inject-v25.py dist/new/index.html

          test -s dist/index.html
          test -s dist/new/index.html
          grep -q 'city-functional-v18-script' dist/index.html
          grep -q 'city-functional-v18-script' dist/new/index.html
          grep -q 'city-visual-v19-script' dist/new/index.html
          grep -q 'city-visual-v20-script' dist/new/index.html
          grep -q 'city-visual-v21-script' dist/new/index.html
          grep -q 'city-visual-v23-script' dist/new/index.html
          grep -q 'city-visual-v24-script' dist/new/index.html
          grep -q 'city-visual-v25-script' dist/new/index.html
          grep -q 'V24_DAYS' dist/new/index.html
          grep -Fq 'Bygg, trykk 🌙, og byen får en ny dag' dist/new/index.html
          grep -q 'v24-saturday' dist/new/index.html
          grep -q 'v24-delete-setting' dist/new/index.html
          grep -q 'v24-stop-wheel' dist/new/index.html
          grep -q 'v25-nav-slot' dist/new/index.html
          grep -q 'v25-action-slot' dist/new/index.html
          grep -q 'v23-category-col' dist/new/index.html
          grep -q 'v23-content-col' dist/new/index.html
          grep -q 'v23-stop-icon' dist/new/index.html
          grep -q 'v23-map-symbol' dist/new/index.html
          grep -q 'citFarmDriveW' dist/index.html
          if grep -q 'city-visual-v19-script\|city-visual-v20-script\|city-visual-v21-script\|city-visual-v23-script\|city-visual-v24-script\|city-visual-v25-script' dist/index.html; then
            echo 'ERROR: experimental visuals leaked into stable root build'
            exit 1
          fi
          echo "stable root: $(wc -c < dist/index.html) bytes"
          echo "visual /new: $(wc -c < dist/new/index.html) bytes"
